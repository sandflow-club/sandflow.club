## Dovecot configuration for sandflow.club
## See /usr/share/doc/dovecot-core/dovecot/ for full documentation.

# Protocols to serve (IMAPS only on 993, no plain IMAP on 143)
# NOTE: LMTP removed — Postfix uses local(8) delivery, not LMTP
protocols = imap pop3

# Listen on all interfaces
listen = *

# Base directory
base_dir = /var/run/dovecot/

# Enabled mail plugins
mail_plugins = quota

# Logging
log_path = /var/log/dovecot.log

# Mail location
mail_location = maildir:~/Maildir
mail_privileged_group = mail

# Include modular configuration files
!include conf.d/*.conf
#!include_try /usr/share/dovecot/protocols.d/*.protocol
