##
## SSL settings
##

# Require SSL/TLS — no plaintext connections allowed
ssl = required

# Let's Encrypt certificate (unified mail cert)
ssl_cert = </etc/letsencrypt/live/smtp.sandflow.club/fullchain.pem
ssl_key = </etc/letsencrypt/live/smtp.sandflow.club/privkey.pem

# Minimum TLS protocol — disable obsolete versions
ssl_min_protocol = TLSv1.2

# Prefer server cipher order over client's
ssl_prefer_server_ciphers = yes

# DH parameters
ssl_dh = </usr/share/dovecot/dh.pem
