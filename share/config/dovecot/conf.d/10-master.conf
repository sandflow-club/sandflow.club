##
## Service configuration
##

# Postfix SMTP AUTH via UNIX socket
service auth {
  # Run as dovecot user for security
  user = dovecot

  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }

  # Local auth socket for lmtp/deliver — restricted to dovecot group
  unix_listener auth-userdb {
    mode = 0600
    user = dovecot
    group = dovecot
  }
}

# IMAP — only TLS on 993, plain 143 disabled for security
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# POP3
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

# LMTP for local delivery
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0660
    user = postfix
    group = postfix
  }
}
