## OpenDKIM configuration for __DOMAIN__
## Deployed to /etc/opendkim.conf
##
## PREREQUISITES:
##   1. Generate DKIM key pair on the server:
##        sudo mkdir -p /etc/opendkim/keys/__MAIL_CERT_NAME__
##        sudo opendkim-genkey -D /etc/opendkim/keys/__MAIL_CERT_NAME__/ \
##            -d __MAIL_CERT_NAME__ -s selector1
##        sudo chown -R opendkim:opendkim /etc/opendkim/keys
##   2. Add the generated DNS TXT record to your domain:
##        cat /etc/opendkim/keys/__MAIL_CERT_NAME__/selector1.txt

Syslog                  yes
SyslogSuccess           yes

Canonicalization        relaxed/simple
OversignHeaders         From

# Run as opendkim user
UserID                  opendkim
UMask                   007

# Socket for Postfix connection (via milter on localhost:8891)
Socket                  inet:8891@localhost

# PID file
PidFile                 /run/opendkim/opendkim.pid

# DNSSEC trust anchor (for verifying incoming DKIM signatures)
TrustAnchorFile         /usr/share/dns/root.key

# Signing configuration
Domain                  __MAIL_CERT_NAME__
Selector                selector1
KeyFile                 /etc/opendkim/keys/__MAIL_CERT_NAME__/selector1.private

# Internal hosts to sign for (localhost only; external mail relayed through
# SASL-authenticated submission is also signed)
InternalHosts           127.0.0.1, ::1
